#The AppVeyor build, as unpaint's: every push builds and packages (ci.ps1); master's builds are published as GitHub
#releases. The project's settings hold the secure variables SECONDSHELL_CERT_PFX and SECONDSHELL_CERT_PW (the signing
#certificate); Axodox.Common prereleases come from axodox-common's public project feed (build.ps1).
version: '{build}'
image: Visual Studio 2022
skip_tags: true

build_script:
- ps: .\ci.ps1
test: off
artifacts:
- path: artifacts\SecondShell-*.msixbundle
  name: Packages
- path: artifacts\SecondShell-*.zip
  name: Packages
- path: artifacts\SecondShell.appinstaller
  name: Packages
- path: artifacts\SecondShell.cer
  name: Packages
- path: artifacts\Install.ps1
  name: Packages
deploy:
- provider: GitHub
  tag: $(SECONDSHELL_RELEASE_TAG)
  release: SecondShell $(APPVEYOR_BUILD_VERSION)
  description: 'Install: put the files in one folder and run Install.ps1 (powershell -ExecutionPolicy Bypass -File .\Install.ps1). The first install trusts the self-signed certificate, with one administrator prompt.'
  prerelease: false
  auth_token:
    secure: cJH8jFWP1GRslj2mqEaIfx/IdyTss+sj0c81d9fAXE/Eq9wCsPju+gM3CkNE0+wc
  artifact: Packages
  on:
    branch: master
